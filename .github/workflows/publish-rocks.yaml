name: Publish tested runner Rocks

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful main push build run ID (blank: latest successful main build)'
        type: string
        required: false
        default: ''

permissions: {}

# Serialize promotions to avoid concurrently publishing the same source tag.
concurrency:
  group: publish-runner-rocks
  cancel-in-progress: false

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      sha: ${{ steps.source.outputs.sha }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select and validate tested build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 scripts/select-rock-build.py --repository "$REPOSITORY" --run-id "$BUILD_RUN_ID"

  publish:
    needs: select
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout publishing code (not selected build source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download tested archive (no rebuild or source execution)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ matrix.artifact_id }}
          run-id: ${{ needs.select.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts
          merge-multiple: true
      - name: Install OCI publishing tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Publish exact tested archive and record digest
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          ARTIFACT: ${{ matrix.artifact }}
          COMMIT: ${{ needs.select.outputs.sha }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          ROCK_VERSION: ${{ matrix.rock_version }}
          SOURCE_RUN: ${{ needs.select.outputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/ghcr-auth.json"
          cleanup() { rm -f "$REGISTRY_AUTH_FILE"; }
          trap cleanup EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$ACTOR" --password-stdin ghcr.io
          python3 scripts/publish-rock.py
